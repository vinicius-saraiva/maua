<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="0.5"/>
    </pattern>

    <!-- Radial glow behind logo -->
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>

    <!-- Corner accent gradient -->
    <radialGradient id="cornerTL" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerBR" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="#0D0D0D"/>

  <!-- Grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Corner accents -->
  <rect width="1920" height="1080" fill="url(#cornerTL)"/>
  <rect width="1920" height="1080" fill="url(#cornerBR)"/>

  <!-- Central glow -->
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Decorative code lines - top left -->
  <text x="60" y="60" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#2D2D2D" opacity="0.6">
    <tspan x="60" dy="0">#!/usr/bin/env maua</tspan>
    <tspan x="60" dy="18">import { build, deploy, ship } from '@maua/core'</tspan>
    <tspan x="60" dy="18">import { ai } from '@maua/intelligence'</tspan>
    <tspan x="60" dy="18"></tspan>
    <tspan x="60" dy="18">const project = await ai.design({</tspan>
    <tspan x="60" dy="18">  stack: 'modern',</tspan>
    <tspan x="60" dy="18">  quality: 'production',</tspan>
    <tspan x="60" dy="18">  speed: 'fast'</tspan>
    <tspan x="60" dy="18">})</tspan>
  </text>

  <!-- Pixel-art MAUA logo - top right -->
  <g opacity="0.35" fill="#E4E4E7">
    <rect x="1490" y="55" width="12" height="12" rx="1"/>
    <rect x="1550" y="55" width="12" height="12" rx="1"/>
    <rect x="1490" y="70" width="12" height="12" rx="1"/>
    <rect x="1505" y="70" width="12" height="12" rx="1"/>
    <rect x="1535" y="70" width="12" height="12" rx="1"/>
    <rect x="1550" y="70" width="12" height="12" rx="1"/>
    <rect x="1490" y="85" width="12" height="12" rx="1"/>
    <rect x="1520" y="85" width="12" height="12" rx="1"/>
    <rect x="1550" y="85" width="12" height="12" rx="1"/>
    <rect x="1490" y="100" width="12" height="12" rx="1"/>
    <rect x="1550" y="100" width="12" height="12" rx="1"/>
    <rect x="1490" y="115" width="12" height="12" rx="1"/>
    <rect x="1550" y="115" width="12" height="12" rx="1"/>
    <rect x="1610" y="55" width="12" height="12" rx="1"/>
    <rect x="1625" y="55" width="12" height="12" rx="1"/>
    <rect x="1640" y="55" width="12" height="12" rx="1"/>
    <rect x="1595" y="70" width="12" height="12" rx="1"/>
    <rect x="1655" y="70" width="12" height="12" rx="1"/>
    <rect x="1595" y="85" width="12" height="12" rx="1"/>
    <rect x="1610" y="85" width="12" height="12" rx="1"/>
    <rect x="1625" y="85" width="12" height="12" rx="1"/>
    <rect x="1640" y="85" width="12" height="12" rx="1"/>
    <rect x="1655" y="85" width="12" height="12" rx="1"/>
    <rect x="1595" y="100" width="12" height="12" rx="1"/>
    <rect x="1655" y="100" width="12" height="12" rx="1"/>
    <rect x="1595" y="115" width="12" height="12" rx="1"/>
    <rect x="1655" y="115" width="12" height="12" rx="1"/>
    <rect x="1700" y="55" width="12" height="12" rx="1"/>
    <rect x="1760" y="55" width="12" height="12" rx="1"/>
    <rect x="1700" y="70" width="12" height="12" rx="1"/>
    <rect x="1760" y="70" width="12" height="12" rx="1"/>
    <rect x="1700" y="85" width="12" height="12" rx="1"/>
    <rect x="1760" y="85" width="12" height="12" rx="1"/>
    <rect x="1700" y="100" width="12" height="12" rx="1"/>
    <rect x="1760" y="100" width="12" height="12" rx="1"/>
    <rect x="1715" y="115" width="12" height="12" rx="1"/>
    <rect x="1730" y="115" width="12" height="12" rx="1"/>
    <rect x="1745" y="115" width="12" height="12" rx="1"/>
    <rect x="1820" y="55" width="12" height="12" rx="1"/>
    <rect x="1835" y="55" width="12" height="12" rx="1"/>
    <rect x="1850" y="55" width="12" height="12" rx="1"/>
    <rect x="1805" y="70" width="12" height="12" rx="1"/>
    <rect x="1865" y="70" width="12" height="12" rx="1"/>
    <rect x="1805" y="85" width="12" height="12" rx="1"/>
    <rect x="1820" y="85" width="12" height="12" rx="1"/>
    <rect x="1835" y="85" width="12" height="12" rx="1"/>
    <rect x="1850" y="85" width="12" height="12" rx="1"/>
    <rect x="1865" y="85" width="12" height="12" rx="1"/>
    <rect x="1805" y="100" width="12" height="12" rx="1"/>
    <rect x="1865" y="100" width="12" height="12" rx="1"/>
    <rect x="1805" y="115" width="12" height="12" rx="1"/>
    <rect x="1865" y="115" width="12" height="12" rx="1"/>
  </g>

  <!-- Decorative terminal dots - top left corner -->
  <circle cx="60" cy="20" r="5" fill="#EF4444" opacity="0.3"/>
  <circle cx="78" cy="20" r="5" fill="#F59E0B" opacity="0.3"/>
  <circle cx="96" cy="20" r="5" fill="#4ADE80" opacity="0.3"/>


  <!-- Bottom bar -->
  <rect x="0" y="1050" width="1920" height="30" fill="#1A1A1A" opacity="0.5"/>

  <!-- Bottom bar content -->
  <text x="60" y="1068" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#4ADE80" opacity="0.5">
    $ maua --status online
  </text>
  <text x="960" y="1068" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#71717A" opacity="0.5" text-anchor="middle">
    maua.pro
  </text>
  <text x="1860" y="1068" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#71717A" opacity="0.5" text-anchor="end">
    construindo o futuro
  </text>

  <!-- Decorative border lines -->
  <line x1="40" y1="40" x2="200" y2="40" stroke="#2D2D2D" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="40" x2="40" y2="200" stroke="#2D2D2D" stroke-width="1" opacity="0.4"/>
  <line x1="1720" y1="1040" x2="1880" y2="1040" stroke="#2D2D2D" stroke-width="1" opacity="0.4"/>
  <line x1="1880" y1="880" x2="1880" y2="1040" stroke="#2D2D2D" stroke-width="1" opacity="0.4"/>

  <!-- Subtle accent dots -->
  <circle cx="40" cy="40" r="2" fill="#4ADE80" opacity="0.4"/>
  <circle cx="1880" cy="1040" r="2" fill="#22D3EE" opacity="0.4"/>

  <!-- Scanline overlay -->
  <rect width="1920" height="1080" fill="url(#scanlines)" opacity="0.3"/>
</svg>